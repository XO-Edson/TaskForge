services:
  jenkins:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: taskforge-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  agent:
    build:
      context: ..
      dockerfile: jenkins/agent.Dockerfile
    container_name: taskforge-agent
    restart: unless-stopped
    depends_on:
      - jenkins
    environment:
      JENKINS_URL: http://jenkins:8080/
      JENKINS_AGENT_NAME: taskforge-agent
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET:?Set JENKINS_AGENT_SECRET in jenkins/.env}
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
