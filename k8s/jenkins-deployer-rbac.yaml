apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskforge-deployer
  namespace: default
rules:
  # Allow Jenkins to update application Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # Allow Jenkins to monitor the ReplicaSets created by Deployments
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]

  # Allow Jenkins to check application pod status
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskforge-deployer
  namespace: default
subjects:
  - kind: Group
    name: taskforge-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: taskforge-deployer
  apiGroup: rbac.authorization.k8s.io

